spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/jacinta}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-seconds=${JWT_ACCESS_SECONDS:900}
app.jwt.refresh-seconds=${JWT_REFRESH_SECONDS:604800}
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.admin-inicial.enabled=${ADMIN_INICIAL_ENABLED:true}
